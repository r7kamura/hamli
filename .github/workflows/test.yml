name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - 2.7.2
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake spec

  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.7.2
        bundler-cache: true
    - run: bundle exec rake rubocop
